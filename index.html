<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Org Wiki Flow</title>
    <link data-trunk rel="css" href="public/css/app.css" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
</head>
<body>
<script>
    // Sync textarea scroll → highlight layer scroll
    document.addEventListener('scroll', function (e) {
        const t = e.target;
        if (t && t.classList && t.classList.contains('edit-layer')) {
            const wrap = t.closest('.editor-wrap');
            if (wrap) {
                const hl = wrap.querySelector('.hl-layer');
                if (hl) {
                    hl.scrollTop  = t.scrollTop;
                    hl.scrollLeft = t.scrollLeft;
                }
            }
        }
    }, true);
</script>
</body>
</html>
