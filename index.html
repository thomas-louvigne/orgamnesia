<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orgamnesia</title>
    <link data-trunk rel="css" href="public/css/app.css" />
    <link data-trunk rel="css" href="public/css/editor.css" />
    <link data-trunk rel="css" href="public/css/panels.css" />
    <link data-trunk rel="css" href="public/css/dialogs.css" />
    <link data-trunk rel="css" href="public/css/lists.css" />
    <link data-trunk rel="copy-file" href="src-tauri/icons/app-icon.svg" />
    <link data-trunk rel="copy-dir" href="public/fonts" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <script>
        // The theme last in effect, before the app starts (see src/theme.rs)
        try {
            const css = localStorage.getItem('theme_css');
            if (css) {
                const style = document.createElement('style');
                style.id = 'theme';
                style.textContent = css;
                document.head.appendChild(style);
            }
        } catch (e) {}
    </script>
</head>
<body>
<script>
    // Sync textarea scroll → highlight layer scroll
    function syncLayers(wrap) {
        const t = wrap && wrap.querySelector('.edit-layer');
        if (!t) return;
        wrap.querySelectorAll('.hl-layer').forEach(function (hl) {
            if (hl.scrollTop  !== t.scrollTop)  hl.scrollTop  = t.scrollTop;
            if (hl.scrollLeft !== t.scrollLeft) hl.scrollLeft = t.scrollLeft;
        });
    }
    document.addEventListener('scroll', function (e) {
        const t = e.target;
        if (t && t.classList && t.classList.contains('edit-layer')) syncLayers(t.closest('.editor-wrap'));
    }, true);
    // A layer redrawn (typing) or an editor resized (split) can lose the textarea's
    // scroll without any scroll event: sync again then
    const resized = new ResizeObserver(function (entries) {
        entries.forEach(function (e) { syncLayers(e.target.closest('.editor-wrap')); });
    });
    new MutationObserver(function (records) {
        records.forEach(function (r) {
            const wrap = r.target.closest && r.target.closest('.editor-wrap');
            if (!wrap) return;
            const t = wrap.querySelector('.edit-layer');
            if (t) resized.observe(t);
            syncLayers(wrap);
        });
    }).observe(document.body, { childList: true, subtree: true });
</script>
</body>
</html>
