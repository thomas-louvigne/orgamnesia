name: Release

# A version bump in tauri.conf.json pushed on main builds the Linux, macOS and Windows packages and
# publishes them in a GitHub release `vX.Y.Z`, creating the tag. Pushing a tag
# `vX.Y.Z` by hand, or running the workflow from the Actions tab, does the same.
on:
  push:
    branches: [main]
    paths: [src-tauri/tauri.conf.json]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The key signing the packages for the app's updater (cargo tauri signer generate):
  # the app only installs a new version signed by it
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  version:
    name: Version to release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([^"]+)",?/\1/')
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but tauri.conf.json says $version"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already published, nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            # What's new in it, shown by the app and on the release: written first
            python3 packaging/release/changelog.py check "$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux packages (.deb, AppImage)
    needs: version
    if: needs.version.outputs.release == 'true'
    # The oldest supported runner: the packages then run on older distributions too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      # With their signatures for the updater (tauri.updater.conf.json)
      - run: cargo tauri build --bundles deb,appimage --config src-tauri/tauri.updater.conf.json

      - name: Release notes, from the changelogs
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: python3 packaging/release/changelog.py body "${TAG#v}" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          # On main the tag does not exist yet: it is created on this commit
          target_commitish: ${{ github.sha }}
          name: Orgamnesia ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  macos:
    name: macOS disk image (.dmg)
    # Adds to the release that the linux job has just created
    needs: [version, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # One app for Apple Silicon and Intel Macs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      # The .dmg to install, the app archived and signed for the updater
      - run: cargo tauri build --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.updater.conf.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  arch:
    name: Arch Linux package (.pkg.tar.zst)
    # Builds the tag that the linux job has just created
    needs: [version, linux]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Build with makepkg
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          pacman -Syu --noconfirm git
          # makepkg refuses to run as root: a build user who may install the dependencies
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          cp -r packaging/arch-release /home/builder/build
          sed -i "s/^pkgver=.*/pkgver=${TAG#v}/" /home/builder/build/PKGBUILD
          chown -R builder: /home/builder/build
          cd /home/builder/build
          sudo -u builder makepkg -s --noconfirm
          mv ./*.pkg.tar.zst "$GITHUB_WORKSPACE/"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: ./*.pkg.tar.zst

  windows:
    name: Windows installer (setup.exe)
    # Adds to the release that the linux job has just created
    needs: [version, linux]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      # Git (MinGit, Git Credential Manager) and the dictionaries, installed with the app
      - run: pwsh packaging/windows/fetch-tools.ps1

      # Installed for the user alone, without administrator rights (see tauri.windows.conf.json)
      - run: cargo tauri build --bundles nsis --config src-tauri/tauri.updater.conf.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig

  updater:
    name: Updater manifest (latest.json)
    # Once every package the updater installs is published, with its signature
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: latest.json, from the signatures and the changelogs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir signatures
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir signatures --pattern '*.sig'
          python3 packaging/release/changelog.py latest "${TAG#v}" signatures \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" > latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
